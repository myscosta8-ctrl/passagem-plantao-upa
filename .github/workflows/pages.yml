name: Deploy para GitHub Pages

# A cada envio ao ramo main: gera a versão de produção e publica em https://viltaloop.com.br
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # Valores públicos (já presentes no site); o acesso aos dados é protegido por login e RLS.
          VITE_SUPABASE_URL: https://fhsyrcksxcdhdbcvjspv.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoc3lyY2tzeGNkaGRiY3Zqc3B2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTczNTAsImV4cCI6MjEwMDk5MzM1MH0.CT1pJUWKk86xH5KO5E5wcKTwX-VayVNVqhS0NdmzmeE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
